apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth
  namespace: streaming-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth

  template:
    metadata:
      labels:
        app: auth

    spec:
      containers:
        - name: auth
          image: gaurydocker/streaming-auth:1.0.0

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: AUTH_PORT

            - name: MONGO_URI
              value: "mongodb://mongo:27017/streamingapp"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streaming-secret
                  key: JWT_SECRET

            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: CLIENT_URLS

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: streaming-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: streaming-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: AWS_REGION
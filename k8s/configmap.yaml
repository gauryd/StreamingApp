apiVersion: v1
kind: ConfigMap
metadata:
  name: streaming-config
  namespace: streaming-app

data:
  AUTH_PORT: "3001"
  STREAMING_PORT: "3002"
  ADMIN_PORT: "3003"
  CHAT_PORT: "3004"

  CLIENT_URLS: "http://streamingapp.local"

  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: ""
  MONGO_DB: "streamingapp"
  MONGO_HOST: "mongo"
  MONGO_PORT: "27017"
  MONGO_URI: "mongodb://mongo:27017/streamingapp"

  STREAMING_PUBLIC_URL: "http://streamingapp.local"
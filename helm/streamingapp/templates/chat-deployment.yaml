apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount.chat }}

  selector:
    matchLabels:
      app: chat

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: chat

    spec:
      containers:
        - name: chat
          image: "{{ .Values.images.chat.repository }}:{{ .Values.images.chat.tag }}"

          ports:
            - containerPort: 3004

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 20

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: CHAT_PORT

            - name: MONGO_URI
              value: {{ .Values.config.mongoUri | quote }}

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streaming-secret
                  key: JWT_SECRET

            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: CLIENT_URLS
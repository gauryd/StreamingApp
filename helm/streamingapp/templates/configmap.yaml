apiVersion: v1
kind: ConfigMap
metadata:
  name: streaming-config
  namespace: {{ .Values.namespace }}
data:
  AUTH_PORT: {{ .Values.config.authPort | quote }}
  STREAMING_PORT: {{ .Values.config.streamingPort | quote }}
  ADMIN_PORT: {{ .Values.config.adminPort | quote }}
  CHAT_PORT: {{ .Values.config.chatPort | quote }}

  CLIENT_URLS: {{ .Values.config.clientUrls | quote }}

  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  AWS_S3_BUCKET: {{ .Values.config.awsS3Bucket | quote }}

  MONGO_DB: {{ .Values.config.mongoDb | quote }}
  MONGO_HOST: {{ .Values.config.mongoHost | quote }}
  MONGO_PORT: {{ .Values.config.mongoPort | quote }}
  MONGO_URI: {{ .Values.config.mongoUri | quote }}

  STREAMING_PUBLIC_URL: {{ .Values.config.streamingPublicUrl | quote }}